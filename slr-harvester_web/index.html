<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="theme-color-meta" content="#0d1117">
  <!-- Content Security Policy. GitHub Pages cannot set response headers, so it
       lives here. connect-src lists every host the app talks to: the search
       APIs, Supabase (*.supabase.co also covers a Cloud Sync override), and the
       read-aloud hosts from SLRTts.NEURAL_REMOTE_HOSTS (Hugging Face redirects
       to *.hf.co). A new host must be added here AND shown in the Privacy view.
       The sha256 source is the inline import map below — change the map, and
       this hash must be recomputed (SHA-256 of the text between the tags).
       'wasm-unsafe-eval' lets the voice engine compile WebAssembly; it does
       not allow eval(). style-src needs 'unsafe-inline' for style attributes. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-YLs+T+FgxcIei7NqLvaWJAs+9cC27eorwbW1makPliw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: data:; connect-src 'self' https://api.elsevier.com https://eutils.ncbi.nlm.nih.gov https://api.openalex.org https://api.crossref.org https://doaj.org https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://huggingface.co https://*.huggingface.co https://*.hf.co; worker-src 'self' blob:; frame-src zotero: citavi:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>SLR Harvester Web</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260918b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=20260918b">
  <!-- Read-aloud: the neural voice engine (Piper) imports "onnxruntime-web/wasm"
       as a bare module specifier, which a browser cannot resolve without a
       bundler. This map supplies it — from the vendored copy, not a CDN
       (see js/vendor/README.md). Nothing is fetched until the neural
       engine is actually used — js/tts.js imports it dynamically. -->
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web/wasm": "./js/vendor/onnxruntime/ort.wasm.min.js"
    }
  }
  </script>
</head>
<body>

  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">
          <span class="logo-icon" id="logo-icon"></span>
          <span class="app-name sidebar-label">SLR Harvester <span class="title-web">Web</span></span>
        </div>
        <button id="sidebar-toggle" class="icon-btn" title="Collapse sidebar" aria-label="Toggle sidebar">
          <span id="sidebar-toggle-icon"></span>
        </button>
      </div>

      <nav class="sidebar-nav" role="navigation" aria-label="Main navigation">

        <!-- Home / welcome screen -->
        <button class="nav-item" data-view="welcome" title="Home" aria-label="Home">
          <span class="nav-icon" data-icon="home"></span>
          <span class="nav-label sidebar-label">Home</span>
        </button>

        <!-- Databases view shortcut -->
        <button class="nav-item" data-view="databases" title="Databases" aria-label="Databases">
          <span class="nav-icon" data-icon="databases"></span>
          <span class="nav-label sidebar-label">Databases</span>
        </button>

        <button class="nav-item" data-view="projects" title="Projects" aria-label="Projects">
          <span class="nav-icon" data-icon="projects"></span>
          <span class="nav-label sidebar-label">Projects</span>
        </button>

        <div class="nav-separator" role="separator"></div>

        <button class="nav-item" data-view="search" title="Search" aria-label="Search">
          <span class="nav-icon" data-icon="search"></span>
          <span class="nav-label sidebar-label">Search</span>
        </button>
        <button class="nav-item" data-view="history" title="Query History" aria-label="Query History">
          <span class="nav-icon" data-icon="history"></span>
          <span class="nav-label sidebar-label">History</span>
        </button>

        <div class="nav-separator" role="separator"></div>

        <button class="nav-item" data-view="articles" title="Articles" aria-label="Articles">
          <span class="nav-icon" data-icon="articles"></span>
          <span class="nav-label sidebar-label">Articles</span>
        </button>
        <button class="nav-item" data-view="selected" title="Selected" aria-label="Selected">
          <span class="nav-icon" data-icon="selected"></span>
          <span class="nav-label sidebar-label">Selected</span>
        </button>
        <button class="nav-item" data-view="corpus" title="Corpus" aria-label="Corpus">
          <span class="nav-icon" data-icon="corpus"></span>
          <span class="nav-label sidebar-label">Corpus</span>
        </button>
        <!-- Visualisations belongs with the three screening stages, not with
             Tags: it reads whatever Articles/Selected/Corpus currently hold
             (its All/Selected/Corpus tabs are exactly those three subsets),
             so it is the last step of that group rather than the first of
             the next one. -->
        <button class="nav-item" data-view="visualizations" title="Visualisations" aria-label="Visualisations">
          <span class="nav-icon" data-icon="chart"></span>
          <span class="nav-label sidebar-label">Visualisations</span>
        </button>

        <div class="nav-separator" role="separator"></div>

        <button class="nav-item" data-view="workspace" title="Workspace" aria-label="Workspace">
          <span class="nav-icon" data-icon="workspace"></span>
          <span class="nav-label sidebar-label">Workspace</span>
        </button>
        <button class="nav-item" data-view="account" title="Account" aria-label="Account">
          <span class="nav-icon" data-icon="account"></span>
          <span class="nav-label sidebar-label">Account</span>
        </button>
        <button class="nav-item" data-view="settings" title="Settings" aria-label="Settings">
          <span class="nav-icon" data-icon="settings"></span>
          <span class="nav-label sidebar-label">Settings</span>
        </button>
        <button class="nav-item" data-view="about" title="About SLR Harvester Web" aria-label="About">
          <span class="nav-icon" data-icon="info"></span>
          <span class="nav-label sidebar-label">About</span>
        </button>
      </nav>
    </aside>

    <!-- Dims the content while the sidebar is open, and closes it on click.
         Deliberately placed AFTER the sidebar and inside #app: the CSS picks
         it up via the sibling selector `.sidebar:not(.collapsed) ~ &`, and
         only inside #app does its z-index compare against the sidebar's at
         all (#app is position:fixed and forms its own stacking context). -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Main Content -->
    <main id="main">
      <header id="topbar">
        <div class="topbar-left">
          <span id="view-title" class="view-title"></span>
        </div>
        <div class="topbar-right">
          <button id="project-badge" class="project-badge" title="Go to Project Info" aria-label="Go to Project Info"></button>
          <button id="fullscreen-toggle" class="theme-switch fullscreen-switch" title="Toggle fullscreen" aria-label="Toggle fullscreen">
            <span class="theme-switch-knob">
              <span id="fullscreen-icon" class="theme-switch-icon"></span>
            </span>
          </button>
          <button id="theme-toggle" class="theme-switch" title="Toggle dark/light mode" aria-label="Toggle theme">
            <span class="theme-switch-knob">
              <span id="theme-icon" class="theme-switch-icon"></span>
            </span>
          </button>
        </div>
      </header>

      <div id="view-container" role="main">
        <!-- Views rendered here by app.js -->
      </div>
    </main>

  </div>

  <!-- Modal overlay (rendered dynamically) -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true"></div>

  <script src="js/icons.js?v=20260918b"></script>
  <!-- Cloud sync (optional): Supabase JS SDK v2.112.3, vendored locally
       (js/vendor/supabase.js) rather than loaded from a CDN. This used to
       be cdn.jsdelivr.net, which browser tracking-prevention features
       (observed: Edge) and ad-blockers/network-level filters flag as a
       third-party origin and sometimes block outright — the likely cause
       of intermittent "Failed to fetch" during sign-in on some desktop
       setups even though the exact same request worked fine elsewhere.
       Same-origin now, so that entire class of blocking can't happen.
       To update: download a newer dist/umd/supabase.js build and replace
       the vendored file; nothing else needs to change. -->
  <script src="js/vendor/supabase.js?v=20260918b"></script>
  <script src="js/data-local.js?v=20260918b"></script>
  <script src="js/data-supabase.js?v=20260918b"></script>
  <script src="js/data.js?v=20260918b"></script>
  <script src="js/world-map-data.js?v=20260918b"></script>
  <script src="js/world-map-outline-data.js?v=20260918b"></script>
  <script src="js/world-map-paths-data.js?v=20260918b"></script>
  <script src="js/world-map.js?v=20260918b"></script>
  <script src="js/tts.js?v=20260918b"></script>
  <script src="js/views.js?v=20260918b"></script>
  <script src="js/app-ui.js?v=20260918b"></script>
  <script src="js/app.js?v=20260918b"></script>

</body>
</html>
