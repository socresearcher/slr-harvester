name: Deploy SLR Harvester Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "slr-harvester_web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Stop before publishing if an internal working file was committed
      # (task lists, suggestions, assistant instructions, planning notes,
      # the paper, logs). Same list as the bottom of .gitignore.
      - name: Refuse internal files
        run: |
          set -euo pipefail
          verboten='(^|/)(TASKS|SUGGESTIONS|CLAUDE|AGENTS|SKILL|TODO|SECURITY_PLAN|INFRASTRUKTUR|SUPABASE|PAPER)\.md$|^\.github/(copilot-instructions\.md|instructions/|prompts/)|\.prompt\.md$|(^|/)paper/|\.(log|bak)$'
          if git ls-files | grep -E "$verboten"; then
            echo "::error::Internal files are tracked (listed above). Remove them before deploying."
            exit 1
          fi

      # Allowlist, not the whole folder: only what the app loads at run time
      # is published. Dev server, backup scripts, the Supabase schema and any
      # Markdown (planning notes, vendor README) stay out of the site even if
      # they are tracked. A new top-level file the app needs must be added here.
      - name: Assemble site
        run: |
          set -euo pipefail
          src=slr-harvester_web
          mkdir -p _site
          cp "$src/index.html" "$src/favicon.svg" "$src/manifest.webmanifest" "$src/sw.js" _site/
          cp -r "$src/css" "$src/js" _site/
          find _site -type f \( -name '*.md' -o -name '*.py' -o -name '*.ps1' -o -name '*.cmd' -o -name '*.bat' -o -name '*.sql' -o -name '*.log' -o -name '*.bak' \) -print -delete
          echo "Published files:"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
